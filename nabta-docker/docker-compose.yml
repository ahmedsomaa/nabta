services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nabta
      POSTGRES_PASSWORD: nabta
      POSTGRES_DB: nabta
    ports:
      - "5432:5432"
    volumes:
      - nabta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabta -d nabta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nabta_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nabta_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: nabta-docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://nabta:nabta@postgres:5432/nabta
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      WEB_URL: http://localhost:5173
      API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: nabta-docker/Dockerfile.web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

  marketing:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: nabta-docker/Dockerfile.marketing
      args:
        VITE_WEB_URL: http://localhost:5173
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - api

  system-admin:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: nabta-docker/Dockerfile.system-admin
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - api

volumes:
  nabta_pg:
  nabta_redis:
  nabta_minio:
